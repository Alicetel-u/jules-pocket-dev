name: Keep Jules one-click tasks running

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jules-auto-continue
  cancel-in-progress: false

jobs:
  continue-waiting-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Continue one-click Jules tasks
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: bun scripts/jules-auto-continue.ts
